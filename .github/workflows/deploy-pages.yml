name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - yps-report-published
      - hosting-content-maintained
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosting-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout hosting source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: source-main
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/**
            .github/workflows/deploy-pages.yml
            llms.txt
            online-draft/playwright/*/index.html
          sparse-checkout-cone-mode: false

      - name: Checkout Shiftori reports
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: yps-reports
          path: source-reports
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            yps-crispy-carnival/*/index.html
            yps-crispy-carnival-vrt/*/out.json
            yps-crispy-carnival-vrt/branches/*/out.json
          sparse-checkout-cone-mode: false

      - name: Verify hosting logic
        run: node --test source-main/.github/scripts/*.test.mjs

      - name: Build constrained public site
        run: |
          node source-main/.github/scripts/build-pages-site.mjs \
            --main-repo source-main \
            --reports-repo source-reports \
            --output "${RUNNER_TEMP}/public"
          node source-main/.github/scripts/validate-pages-site.mjs "${RUNNER_TEMP}/public" > "${RUNNER_TEMP}/pages-validation.json"
          cat "${RUNNER_TEMP}/pages-validation.json"
          {
            echo '### GitHub Pages artifact'
            echo
            echo '```json'
            cat "${RUNNER_TEMP}/pages-validation.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
